# Production stack: Caddy (web) → API → Postgres. Runs on the server from /opt/interview-app with
# a .env file next to it (created by deploy/init-env.sh; see .env.prod.example) and is deployed by
# deploy/deploy.sh. Locally: docker compose -f compose.prod.yml up.
name: interview-app-prod

services:
  web:
    image: ${WEB_IMAGE:-interview-app-web:local}
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      # Certificates live on the data volume so a rebuilt server doesn't re-request them
      # (Let's Encrypt rate-limits duplicate certificates).
      - ${DATA_DIR:-./prod-data}/caddy/data:/data
      - ${DATA_DIR:-./prod-data}/caddy/config:/config
    depends_on:
      api: { condition: service_healthy }

  api:
    image: ${API_IMAGE:-interview-app-api:local}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: &api-env
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Runs pending migrations, then exits. The API only starts if this succeeds.
  migrate:
    image: ${API_IMAGE:-interview-app-api:local}
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    restart: 'no'
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - ${DATA_DIR:-./prod-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 2s
      retries: 15
    # No ports: only reachable from the api and migrate containers on the compose network.
