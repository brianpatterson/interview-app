name: Deploy

# Every green CI run on main that changes something that ships goes to production (docs-only
# merges are skipped; see the `changes` job). Manual runs (Actions → Deploy → Run workflow)
# redeploy the current main, e.g. after replacing the droplet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run), or the current main (manual run).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/roundtable

jobs:
  # Every deploy restarts the API and Caddy (about 10 seconds down), so don't deploy when nothing
  # that ships has changed since what production runs, e.g. a docs-only merge.
  changes:
    # `branches: [main]` above matches the branch *name*, which a fork's PR can also use. Only
    # deploy CI runs from a push to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find the last successful deploy run
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run always deploys (e.g. after replacing the droplet).
          if [ "$EVENT" = workflow_dispatch ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # What production runs: the commit of the last successful deploy run. A failed deploy
          # rolls back and exits 1, so it never counts; a skipped one only changed non-shipping
          # files, so production is equivalent to it.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable previous deploy ($base): deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$SHA")
          echo "Changed since $base:"; echo "${changed:-(nothing)}"
          # Files that never reach the server: docs, Markdown, agent config, and OpenTofu (applied
          # by a human, not by this workflow). Anything else, including workflows, deploys.
          shipping=$(printf '%s\n' "$changed" | grep -vE '^(docs/|\.claude/|infra/)|\.md$' | grep -v '^$' || true)
          if [ -n "$shipping" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that ships changed since $base; skipping the deploy."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # Immutable SHA tag for deploys and rollbacks; `latest` only for humans browsing.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live in this protected environment, and GitHub records every deployment to it.
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read # the server pulls images with this run's token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key from OpenTofu: no trust-on-first-use, and a server that isn't ours is refused.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" > ~/.ssh/config

      - name: Copy compose file and deploy script
        run: scp compose.prod.yml deploy/deploy.sh prod:/opt/interview-app/

      - name: Deploy (health-checked, rolls back on failure)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # Log in to the registry with this run's short-lived token, in a throwaway Docker config,
          # so no registry credential is ever stored on the server.
          printf '%s' "$TOKEN" | ssh prod "
            set -e
            export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \$DOCKER_CONFIG' EXIT
            docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null
            /opt/interview-app/deploy.sh '$IMAGE_PREFIX-api:$SHA' '$IMAGE_PREFIX-web:$SHA'
          "

      - name: Smoke test from outside
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"db":"up"'
          curl -fsS -o /dev/null -w 'index.html: %{http_code}\n' "https://$DOMAIN/"
