name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo. Grant more per job if one ever needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm prettier --check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency register is complete
        run: pnpm check:deps
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate --name <change>' and commit it."
            exit 1
          }
          test -z "$(git status --porcelain -- apps/api/drizzle)" || {
            echo "::error::Uncommitted migration generated. Run 'pnpm db:generate' and commit it."
            exit 1
          }
      - name: Test
        run: pnpm test

  # The production images must build. They're not pushed here; the deploy pipeline does that.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    env:
      TF_INPUT: 0 # fail instead of waiting for input that will never come
      # Reuse downloaded providers between runs: faster, and a GitHub release-download outage
      # (504s on every provider, 2026-11-09) no longer fails the job once they're cached.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - name: Cache OpenTofu providers
        uses: actions/cache@v6
        with:
          path: .tofu-plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # The default wrapper captures tofu's output for later steps, but it breaks piped stdin, so
          # `tofu console` in test-cloud-init.sh hung until the job timed out.
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - name: ShellCheck (deploy and infra scripts)
        run: shellcheck ../deploy/*.sh test-cloud-init.sh
      - run: tofu init -backend=false
      - run: tofu validate
      - name: cloud-init creates the expected users
        run: ./test-cloud-init.sh
