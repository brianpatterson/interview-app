name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm prettier --check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency register is complete
        run: pnpm check:deps
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || {
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate --name <change>' and commit it."
            exit 1
          }
          test -z "$(git status --porcelain -- apps/api/drizzle)" || {
            echo "::error::Uncommitted migration generated. Run 'pnpm db:generate' and commit it."
            exit 1
          }
      - name: Test
        run: pnpm test
