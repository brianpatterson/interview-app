name: Dependency review

# Fails a PR that adds a dependency with a known vulnerability or a license we can't use.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
