name: CodeQL

# Static analysis for security bugs (injection, unsafe redirects, prototype pollution, ...) in our
# TypeScript and in the workflows themselves. Results appear under Security → Code scanning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly, so new CodeQL queries run against unchanged code too

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
